version: '3.8'

services:
  l3mcore:
    build: .
    container_name: l3mcore-engine
    ports:
      - "11435:11435"
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
